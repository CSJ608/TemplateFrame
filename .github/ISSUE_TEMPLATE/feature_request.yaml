name: 能力建议
description: 新插件、新能力或使用场景不覆盖的需求
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 想解决的场景
      description: 你的业务里遇到了什么（单据打印 / 列表导入导出 / ……），现在用什么方式勉强解决
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望的能力
      description: 期望库提供什么样的 API 或行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其他做法（含其他库），为什么不满意
