# CI：push / PR 时构建 + 测试
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TemplateFrame.slnx

      - name: Format
        run: dotnet format TemplateFrame.slnx --verify-no-changes

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release --no-restore

      - name: Test (Linux: net8.0 — net472 需 Windows 运行时)
        if: runner.os == 'Linux'
        run: dotnet test TemplateFrame.slnx -c Release --no-build -f net8.0 --collect:"XPlat Code Coverage"

      - name: Test (Windows: 全部目标框架)
        if: runner.os == 'Windows'
        run: dotnet test TemplateFrame.slnx -c Release --no-build --collect:"XPlat Code Coverage"