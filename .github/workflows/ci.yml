# CI：push / PR 时构建 + 测试
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TemplateFrame.slnx

      - name: Format
        run: dotnet format TemplateFrame.slnx --verify-no-changes

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TemplateFrame.slnx -c Release --no-build