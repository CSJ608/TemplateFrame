# Tags must pass tests and dependency audits before GitHub / NuGet publishing.
# Register the trusted publisher and NUGET_USER repository variable first.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing stable release tag whose four symbol packages should be recovered (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props)"
          if [ -z "$version" ] || [ "$version" != "$tag" ]; then
            echo "::error::src/Directory.Build.props version does not match the release tag."
            exit 1
          fi

      - name: Set up .NET SDKs and test runtimes
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.426
            10.0.402

      - name: Restore with transitive vulnerability audit
        run: dotnet restore TemplateFrame.slnx

      - name: Verify audit feed freshness and check OSV
        shell: pwsh
        run: ./eng/audit-dependencies.ps1 -ReportPath artifacts/dependency-audit.json

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release --no-restore

      - name: Test all Windows target frameworks
        run: dotnet test TemplateFrame.slnx -c Release --no-build

  release:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.426
            10.0.402

      - name: Restore with transitive vulnerability audit
        run: dotnet restore TemplateFrame.slnx

      - name: Verify audit feed freshness and check OSV
        shell: pwsh
        run: ./eng/audit-dependencies.ps1 -ReportPath artifacts/dependency-audit.json

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/TemplateFrame/TemplateFrame.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Word/TemplateFrame.Word.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Excel/TemplateFrame.Excel.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Excel.Simple/TemplateFrame.Excel.Simple.csproj -c Release --no-build -o artifacts

      - name: Verify NUGET_USER variable
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is empty. Add it as a repository Actions variable."
            exit 1
          fi

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push primary packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --no-symbols --skip-duplicate

      - name: Push symbol packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Extract changelog section for this version
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v header="## [$version]" '
            found == 0 && index($0, header) == 1 { found = 1; next }
            found == 1 && index($0, "## [") == 1 { exit }
            found == 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (from CHANGELOG)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Create Release (auto-generated notes)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  symbols:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up .NET SDK for symbol publishing
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402

      - name: Download and verify existing release symbol packages
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          import zipfile

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise ValueError("release_tag must be a stable tag in vX.Y.Z format.")
          version = tag[1:]
          repository = os.environ["GITHUB_REPOSITORY"]
          api_url = os.environ["GITHUB_API_URL"].rstrip("/")

          def get_api(endpoint, accept="application/vnd.github+json"):
              for attempt in range(3):
                  try:
                      result = subprocess.run([
                          "gh", "api", endpoint, "--header", "Accept: " + accept,
                      ], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=90)
                      return result.stdout
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      if attempt == 2:
                          raise RuntimeError("GitHub API request failed after three attempts: " + endpoint) from None
                      time.sleep(2 * (attempt + 1))

          release = json.loads(get_api(f"repos/{repository}/releases/tags/{tag}"))
          if release.get("tag_name") != tag or release.get("draft") is not False or release.get("prerelease") is not False:
              raise ValueError("Recovery requires an existing non-draft, non-prerelease GitHub Release.")
          package_ids = ("TemplateFrame", "TemplateFrame.Word", "TemplateFrame.Excel", "TemplateFrame.Excel.Simple")
          expected = {f"{package_id}.{version}.snupkg": package_id for package_id in package_ids}
          assets = [asset for asset in release["assets"] if asset["name"] in expected]
          if len(assets) != 4 or {asset["name"] for asset in assets} != set(expected):
              raise ValueError("Release must contain exactly one asset for each of the four expected symbol package names.")

          output = Path("symbol-packages")
          output.mkdir()
          for asset in assets:
              name = asset["name"]
              asset_id = asset["id"]
              endpoint = f"repos/{repository}/releases/assets/{asset_id}"
              if not isinstance(asset_id, int) or asset.get("url") != f"{api_url}/{endpoint}" or asset.get("state") != "uploaded":
                  raise ValueError(f"Asset is not an uploaded asset of the current repository: {name}")
              digest = asset.get("digest", "")
              if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise ValueError(f"Asset has no usable GitHub SHA256 digest: {name}")
              content = get_api(endpoint, "application/octet-stream")
              if len(content) != asset["size"] or "sha256:" + hashlib.sha256(content).hexdigest() != digest:
                  raise ValueError(f"GitHub size/digest verification failed: {name}")
              with zipfile.ZipFile(io.BytesIO(content)) as package:
                  entries = package.namelist()
                  nuspecs = [entry for entry in entries if entry.endswith(".nuspec")]
                  if len(entries) != len(set(entries)) or len(nuspecs) != 1:
                      raise ValueError(f"Duplicate ZIP entries or unexpected nuspec count: {name}")
                  metadata = ET.fromstring(package.read(nuspecs[0])).find("{*}metadata")
                  if metadata is None or metadata.findtext("{*}id") != expected[name] or metadata.findtext("{*}version") != version:
                      raise ValueError(f"Package ID/version does not match the release: {name}")
                  required_pdbs = {f"lib/{tfm}/{expected[name]}.pdb" for tfm in ("netstandard2.0", "net462", "net8.0")}
                  if {entry for entry in entries if entry.endswith(".pdb")} != required_pdbs:
                      raise ValueError(f"Unexpected target framework PDB set: {name}")
                  for pdb in required_pdbs:
                      with package.open(pdb) as stream:
                          if stream.read(4) != b"BSJB":
                              raise ValueError(f"Not a portable PDB: {name} / {pdb}")
              (output / name).write_bytes(content)
              print(f"Verified {name}: {digest}")

      - name: Verify NUGET_USER variable
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is empty. Add it as a repository Actions variable."
            exit 1
          fi

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Recover only verified symbol packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "symbol-packages/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
