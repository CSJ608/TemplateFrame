# 打标签 v* 时：构建 + 测试 + 打包，创建 GitHub Release 并附 nupkg/snupkg。
# Release 正文优先从 CHANGELOG.md 提取当前版本段落；找不到时回退到 GitHub 自动生成。
# 参考：StreamFrame 的 .github/workflows/release.yml
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify csproj version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for proj in src/TemplateFrame/TemplateFrame.csproj \
                      src/TemplateFrame.Word/TemplateFrame.Word.csproj \
                      src/TemplateFrame.Excel/TemplateFrame.Excel.csproj \
                      src/TemplateFrame.Excel.Simple/TemplateFrame.Excel.Simple.csproj; do
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$proj")"
            if [ -z "$version" ] || [ "$version" != "$tag" ]; then
              echo "::error::$proj <Version>=$version does not match tag $GITHUB_REF_NAME (see docs/PUBLISHING.md)"
              exit 1
            fi
          done

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release

      - name: Test
        run: dotnet test TemplateFrame.slnx -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/TemplateFrame/TemplateFrame.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Word/TemplateFrame.Word.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Excel/TemplateFrame.Excel.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Excel.Simple/TemplateFrame.Excel.Simple.csproj -c Release --no-build -o artifacts

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        id: notes
        run: |
          version="${{ steps.tag.outputs.version }}"
          awk -v header="## [$version]" '
            found == 0 && index($0, header) == 1 { found = 1; next }
            found == 1 && index($0, "## [") == 1 { exit }
            found == 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (from CHANGELOG)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Create Release (auto-generated notes)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg