# 打标签 v* 时：测试门禁（全目标框架）→ 构建 + 打包 → GitHub Release + OIDC Trusted Publishing 推送 nuget.org。
# 2.1.1 起合并原 release.yml 与 publish-nuget.yml：
#   - 发布（GitHub Release / nuget.org 均不可撤回）必须通过测试门禁（needs: test），tag 打在未跑过 CI 的提交上也无法绕过；
#   - 测试在 windows 上跑全部目标框架（net472 需要 Windows 运行时），补齐原发布链路对 netfx 资产的零验证；
#   - 消除两份工作流的重复 build/pack 步骤（历史上漏过一次少打包两个包）。
# 前置（一次性，浏览器操作）：
#   1. nuget.org 注册本仓库为 trusted publisher（见 docs/PUBLISHING.md）
#   2. GitHub 仓库 Settings → Secrets and variables → Actions → Variables 添加 NUGET_USER
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write   # OIDC Trusted Publishing
  contents: write   # GitHub Release

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props)"
          if [ -z "$version" ] || [ "$version" != "$tag" ]; then
            echo "::error::src/Directory.Build.props <Version>=$version does not match tag $GITHUB_REF_NAME (see docs/PUBLISHING.md)"
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TemplateFrame.slnx

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release --no-restore

      - name: Test（windows 全部目标框架；发布门禁）
        run: dotnet test TemplateFrame.slnx -c Release --no-build

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build
        run: dotnet build TemplateFrame.slnx -c Release

      - name: Pack
        run: |
          dotnet pack src/TemplateFrame/TemplateFrame.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Word/TemplateFrame.Word.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Excel/TemplateFrame.Excel.csproj -c Release --no-build -o artifacts
          dotnet pack src/TemplateFrame.Excel.Simple/TemplateFrame.Excel.Simple.csproj -c Release --no-build -o artifacts

      - name: Verify NUGET_USER variable
        run: |
          echo "NUGET_USER length: ${#NUGET_USER}"
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::NUGET_USER is EMPTY. Add it in Settings → Secrets and variables → Actions → Variables (not Secrets)."
            exit 1
          fi
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}

      - name: NuGet Login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://www.nuget.org/api/v2/package \
            --skip-duplicate

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        id: notes
        run: |
          version="${{ steps.tag.outputs.version }}"
          awk -v header="## [$version]" '
            found == 0 && index($0, header) == 1 { found = 1; next }
            found == 1 && index($0, "## [") == 1 { exit }
            found == 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (from CHANGELOG)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Create Release (auto-generated notes)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
